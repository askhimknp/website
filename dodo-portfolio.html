<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodo's Portfolio · TSX</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111418;
    --surface2: #181c22;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.04);
    --text-primary: #f0f2f5;
    --text-secondary: #7a8494;
    --text-muted: #424b5a;
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --accent: #6366f1;
    --accent2: #818cf8;
    --accent-dim: rgba(99,102,241,0.15);
    --gold: #f59e0b;
    --gold-dim: rgba(245,158,11,0.12);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 40px 32px;
    line-height: 1.5;
  }

  /* Ambient background glow */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 400px;
    background: radial-gradient(ellipse at center, rgba(99,102,241,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }

  /* ── Header ── */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 36px;
    flex-wrap: wrap;
    gap: 24px;
    animation: fadeUp 0.5s ease both;
  }

  .header-left { display: flex; flex-direction: column; gap: 6px; }

  .header-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-eyebrow::before {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: var(--accent2);
  }

  h1 {
    font-size: 36px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -1px;
    line-height: 1.1;
  }

  h1 span { color: var(--accent2); }

  .header-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* ── Summary Cards ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
    animation: fadeUp 0.5s 0.1s ease both;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }

  .summary-card:hover {
    border-color: rgba(255,255,255,0.13);
    transform: translateY(-1px);
  }

  .summary-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.025) 0%, transparent 60%);
    pointer-events: none;
  }

  .summary-card.accent-card {
    background: linear-gradient(135deg, var(--accent-dim) 0%, var(--surface) 60%);
    border-color: rgba(99,102,241,0.25);
  }

  .card-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    font-size: 16px;
  }

  .card-icon.indigo { background: var(--accent-dim); }
  .card-icon.green { background: var(--green-dim); }
  .card-icon.gold { background: var(--gold-dim); }
  .card-icon.purple { background: rgba(139,92,246,0.12); }

  .card-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .card-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .card-value.accent { color: var(--accent2); }

  /* ── Table Container ── */
  .table-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    animation: fadeUp 0.5s 0.2s ease both;
  }

  .table-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border2);
    flex-wrap: wrap;
    gap: 12px;
    background: var(--surface2);
  }

  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .toolbar-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.2px;
  }

  .count-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--accent-dim);
    color: var(--accent2);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 20px;
    padding: 2px 10px;
  }

  .filter-tabs {
    display: flex;
    gap: 3px;
    background: var(--bg);
    border-radius: 10px;
    padding: 3px;
    border: 1px solid var(--border);
  }

  .filter-tab {
    padding: 5px 16px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    border: none;
    background: none;
    border-radius: 7px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }

  .filter-tab.active {
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  .toolbar-right { display: flex; align-items: center; gap: 10px; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    transition: border-color 0.15s;
  }

  .search-box:focus-within { border-color: rgba(99,102,241,0.4); }

  .search-box input {
    border: none;
    background: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-primary);
    outline: none;
    width: 180px;
  }

  .search-box input::placeholder { color: var(--text-muted); }

  /* ── Table ── */
  table { width: 100%; border-collapse: collapse; }

  thead th {
    padding: 13px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    color: var(--text-muted);
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    border-bottom: 1px solid var(--border2);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
    background: var(--surface2);
  }

  thead th:hover { color: var(--text-secondary); }
  thead th.sorted { color: var(--accent2); }

  .sort-icon {
    display: inline-block;
    margin-left: 5px;
    opacity: 0.3;
    font-size: 8px;
    transition: opacity 0.15s;
    vertical-align: middle;
  }

  th:hover .sort-icon, th.sorted .sort-icon { opacity: 1; }

  tbody tr {
    border-bottom: 1px solid var(--border2);
    transition: background 0.12s;
    animation: rowFadeIn 0.3s ease both;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }

  td { padding: 16px 20px; font-size: 13.5px; vertical-align: middle; }

  /* Symbol cell */
  .symbol-wrap { display: flex; align-items: center; gap: 14px; }

  .symbol-avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    color: var(--accent2);
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .symbol-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text-primary);
    letter-spacing: -0.2px;
  }

  .symbol-full {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
    margin-top: 2px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0;
  }

  .mono {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .price-val { color: var(--text-secondary); font-weight: 400; }
  .mv-val { font-weight: 500; color: var(--text-primary); }

  /* Weight */
  .weight-cell { display: flex; align-items: center; gap: 10px; }

  .weight-bar-bg {
    width: 60px;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .weight-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .weight-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    min-width: 44px;
  }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .badge-equity {
    background: var(--accent-dim);
    color: var(--accent2);
    border: 1px solid rgba(99,102,241,0.2);
  }

  .badge-etf {
    background: var(--gold-dim);
    color: var(--gold);
    border: 1px solid rgba(245,158,11,0.2);
  }

  .direction-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(34,197,94,0.2);
  }

  .direction-badge::before {
    content: '↑';
    font-size: 10px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* Footer */
  footer {
    margin-top: 28px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    animation: fadeUp 0.5s 0.35s ease both;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes rowFadeIn {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Responsive */
  @media (max-width: 900px) {
    body { padding: 20px 16px; }
    h1 { font-size: 26px; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 600px) {
    .summary-grid { grid-template-columns: 1fr 1fr; }
    .filter-tab { padding: 5px 10px; }
    .search-box input { width: 120px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <div class="header-eyebrow">TSX · CAD · Live Portfolio</div>
      <h1>Dodo's <span>Portfolio</span></h1>
      <div class="header-meta">13 positions · Updated May 2025</div>
    </div>
  </header>

  <div class="summary-grid" id="summaryCards"></div>

  <div class="table-container">
    <div class="table-toolbar">
      <div class="toolbar-left">
        <span class="toolbar-title">Holdings</span>
        <span class="count-pill" id="countPill">13</span>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="filterType('all',this)">All</button>
          <button class="filter-tab" onclick="filterType('EQUITY',this)">Equity</button>
          <button class="filter-tab" onclick="filterType('ETF',this)">ETF</button>
        </div>
      </div>
      <div class="toolbar-right">
        <div class="search-box">
          <svg width="13" height="13" fill="none" stroke="#424b5a" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Search symbol or name…" oninput="searchTable(this.value)" />
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th onclick="sortTable('symbol')">Name <span class="sort-icon" id="sort-symbol">⬍</span></th>
          <th onclick="sortTable('price')">Price <span class="sort-icon" id="sort-price">⬍</span></th>
          <th onclick="sortTable('qty')">Qty <span class="sort-icon" id="sort-qty">⬍</span></th>
          <th onclick="sortTable('marketValue')">Market Value <span class="sort-icon" id="sort-marketValue">⬍</span></th>
          <th onclick="sortTable('weight')" class="sorted">Weight <span class="sort-icon" id="sort-weight">↓</span></th>
          <th onclick="sortTable('type')">Type <span class="sort-icon" id="sort-type">⬍</span></th>
          <th>Direction</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>All values in CAD · TSX market · Portfolio data is for informational purposes only</footer>
</div>

<script>
const rawData = [
  { symbol: 'AMZN', name: 'Amazon.com CDR (CAD Hedged)', type: 'EQUITY', qty: 38, price: 24.83 },
  { symbol: 'ASML', name: 'ASML CDR (CAD Hedged)', type: 'EQUITY', qty: 2, price: 37.15 },
  { symbol: 'META', name: 'Meta CDR (CAD Hedged)', type: 'EQUITY', qty: 25, price: 34.75 },
  { symbol: 'MSFT', name: 'Microsoft CDR (CAD Hedged)', type: 'EQUITY', qty: 21, price: 29.01 },
  { symbol: 'NFLX', name: 'Netflix CDR (CAD Hedged)', type: 'EQUITY', qty: 27, price: 37.21 },
  { symbol: 'NVDA', name: 'Nvidia CDR (CAD Hedged)', type: 'EQUITY', qty: 20, price: 41.04 },
  { symbol: 'SHOP', name: 'Shopify Inc.', type: 'EQUITY', qty: 5, price: 180.90 },
  { symbol: 'VGRO', name: 'Vanguard Growth ETF Portfolio', type: 'ETF', qty: 11, price: 43.41 },
  { symbol: 'XESG', name: 'iShares ESG Aware MSCI Canada Index ETF', type: 'ETF', qty: 26, price: 40.29 },
  { symbol: 'XGRO', name: 'iShares Core Growth ETF Portfolio', type: 'ETF', qty: 5, price: 35.26 },
  { symbol: 'XIU',  name: 'BlackRock Canada iShares S&P/TSX 60 Index ETF', type: 'ETF', qty: 4, price: 48.51 },
  { symbol: 'ZEB',  name: 'BMO Equal Weight Banks Index ETF', type: 'ETF', qty: 2, price: 60.04 },
  { symbol: 'ZNQ',  name: 'BMO Nasdaq 100 Equity Index ETF', type: 'ETF', qty: 4, price: 109.14 },
];

const totalValue = rawData.reduce((s, r) => s + r.qty * r.price, 0);
const data = rawData.map(r => ({
  ...r,
  marketValue: r.qty * r.price,
  weight: (r.qty * r.price / totalValue) * 100,
}));

let currentSort = { col: 'weight', dir: 'desc' };
let currentFilter = 'all';
let currentSearch = '';

function fmtCAD(n) {
  return '$' + n.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(n) { return n.toFixed(2) + '%'; }

function renderSummary() {
  const totalMV = data.reduce((s, r) => s + r.marketValue, 0);
  const equityMV = data.filter(r => r.type === 'EQUITY').reduce((s, r) => s + r.marketValue, 0);
  const etfMV = data.filter(r => r.type === 'ETF').reduce((s, r) => s + r.marketValue, 0);
  const equityPct = (equityMV / totalMV * 100).toFixed(1);
  const etfPct = (etfMV / totalMV * 100).toFixed(1);

  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-card accent-card">
      <div class="card-icon indigo">💼</div>
      <div class="card-label">Total Portfolio Value</div>
      <div class="card-value accent">${fmtCAD(totalMV)}</div>
    </div>
    <div class="summary-card">
      <div class="card-icon indigo">📊</div>
      <div class="card-label">Positions</div>
      <div class="card-value">${data.length}</div>
    </div>
    <div class="summary-card">
      <div class="card-icon purple">📈</div>
      <div class="card-label">Equity Value · ${equityPct}%</div>
      <div class="card-value">${fmtCAD(equityMV)}</div>
    </div>
    <div class="summary-card">
      <div class="card-icon gold">🏦</div>
      <div class="card-label">ETF Value · ${etfPct}%</div>
      <div class="card-value">${fmtCAD(etfMV)}</div>
    </div>
  `;
}

function getFilteredSorted() {
  let rows = [...data];
  if (currentFilter !== 'all') rows = rows.filter(r => r.type === currentFilter);
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    rows = rows.filter(r => r.symbol.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
  }
  rows.sort((a, b) => {
    let av = a[currentSort.col], bv = b[currentSort.col];
    if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return currentSort.dir === 'asc' ? -1 : 1;
    if (av > bv) return currentSort.dir === 'asc' ? 1 : -1;
    return 0;
  });
  return rows;
}

function render() {
  const rows = getFilteredSorted();
  const maxWeight = Math.max(...data.map(r => r.weight));
  document.getElementById('countPill').textContent = rows.length;
  const tbody = document.getElementById('tableBody');

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">No holdings match your search.</div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map((r, i) => `
    <tr style="animation-delay:${i * 0.03}s">
      <td>
        <div class="symbol-wrap">
          <div class="symbol-avatar">${r.symbol.slice(0,4)}</div>
          <div>
            <div class="symbol-name">${r.symbol}</div>
            <div class="symbol-full">${r.name}</div>
          </div>
        </div>
      </td>
      <td class="mono price-val">${fmtCAD(r.price)}</td>
      <td class="mono">${r.qty}</td>
      <td class="mono mv-val">${fmtCAD(r.marketValue)}</td>
      <td>
        <div class="weight-cell">
          <div class="weight-bar-bg"><div class="weight-bar" style="width:${(r.weight/maxWeight)*100}%"></div></div>
          <span class="weight-text">${fmtPct(r.weight)}</span>
        </div>
      </td>
      <td><span class="badge ${r.type === 'EQUITY' ? 'badge-equity' : 'badge-etf'}">${r.type}</span></td>
      <td><span class="direction-badge">LONG</span></td>
    </tr>
  `).join('');
}

function sortTable(col) {
  if (currentSort.col === col) {
    currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort = { col, dir: 'desc' };
  }
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  const colMap = { symbol: 0, price: 1, qty: 2, marketValue: 3, weight: 4, type: 5 };
  const th = document.querySelectorAll('thead th')[colMap[col]];
  if (th) {
    th.classList.add('sorted');
    document.getElementById(`sort-${col}`).textContent = currentSort.dir === 'asc' ? '↑' : '↓';
  }
  // Reset others
  Object.keys(colMap).forEach(k => {
    if (k !== col) {
      const el = document.getElementById(`sort-${k}`);
      if (el) el.textContent = '⬍';
    }
  });
  render();
}

function filterType(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function searchTable(val) {
  currentSearch = val;
  render();
}

// Init
renderSummary();
render();
</script>
</body>
</html>
